name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile

      - name: Typecheck (both packages)
        run: bun run typecheck
      - name: Unit tests (both packages)
        run: bun run test
      - name: Build (both packages)
        run: bun run build
      - name: Build the site (plushies and the cursor demo, one page)
        run: bun run site:build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser tests (plushies builds + the site, cursor demo included)
        run: bun run --cwd packages/plushies test:e2e
      - name: Browser tests (cursors lib)
        if: ${{ !cancelled() }}
        run: bun run --cwd packages/cursors test:browser

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/plushies/_site

  pages:
    name: Deploy GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
