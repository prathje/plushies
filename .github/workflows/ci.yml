name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile

      - name: Typecheck (both packages)
        run: bun run typecheck
      - name: Unit tests (both packages)
        run: bun run test
      - name: Build (both packages)
        run: bun run build
      - name: Build the site (plushies and the cursor demo, one page)
        run: bun run site:build

      - name: Install Chromium
        # The workspace's own Playwright: bunx fetches the latest release instead, and
        # its browser build is not the one the tests' Playwright looks for.
        run: bun run --cwd packages/plushies playwright install --with-deps chromium
      # WebGL on the CPU through Mesa's llvmpipe in a headed browser on a virtual
      # display, instead of headless SwiftShader, which wedges on this runner now
      # and then (see packages/plushies/test/e2e/browser.ts). xvfb and Mesa come
      # with the runner image and with Playwright's --with-deps.
      - name: Browser tests (plushies builds + the site, cursor demo included)
        run: xvfb-run -a -s "-screen 0 1280x900x24" bun run --cwd packages/plushies test:e2e
        env:
          E2E_GL: mesa
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Browser tests (cursors lib)
        if: ${{ !cancelled() }}
        run: xvfb-run -a -s "-screen 0 1280x900x24" bun run --cwd packages/cursors test:browser
        env:
          E2E_GL: mesa
          LIBGL_ALWAYS_SOFTWARE: '1'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/plushies/_site

  pages:
    name: Deploy GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
