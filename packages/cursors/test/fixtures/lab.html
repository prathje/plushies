<!doctype html>
<html>
<head><meta charset="utf-8" /><title>cursor lab</title>
<style>
  body { margin: 0; font: 14px system-ui; }
  .box { position: absolute; width: 600px; height: 400px; background: #f4f1ec; }
  #a { left: 0; top: 0; }
  #b { left: 640px; top: 40px; }
  #scaled { left: 0; top: 440px; transform: scale(.5); transform-origin: 0 0; }
  #thing { position: absolute; left: 100px; top: 120px; width: 160px; height: 60px; background: #ddd; }
  #scaled-thing { position: absolute; left: 200px; top: 100px; width: 120px; height: 80px; background: #ccc; }
  canvas { position: absolute; left: 300px; top: 220px; width: 200px; height: 100px; border: 4px solid #333; padding: 6px; }
</style></head>
<body>
  <div id="outer" style="position:absolute;left:20px;top:30px;width:620px;height:420px">
    <div class="box" id="a"><div id="thing"></div><canvas id="cv" width="400" height="200"></canvas></div>
  </div>
  <div class="box" id="b"></div>
  <div class="box" id="scaled"><div id="scaled-thing"></div></div>
  <div id="host"></div>
  <script type="module" src="./lab.ts"></script>
</body>
</html>
